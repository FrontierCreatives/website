<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/quiz-app/" />
<title>Frontier Creatives · Export</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
<style> :root { --maxw: 820px; } </style>
</head>
<body>
<div class="wash sand"></div>
<div id="app" class="wrap">
  <header class="top">
    <a class="wordmark" href="../"><img src="../assets/logo/fc-mark.svg" alt="" /><span>Frontier Creatives</span></a>
    <span class="ctx">Export</span>
  </header>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
fcInitTheme();
if (fcRequireConfig()) fcGate(startResults);

function startResults() {
  const view = document.getElementById("view");
  const sb = FC.client;
  let aq = [], stamp = "";

  async function load() {
    const { data: st } = await sb.from("quiz_state").select("active_quiz_id").eq("id", 1).single();
    aq = await fcLoadQuestions(sb, st && st.active_quiz_id);
    stamp = new Date().toISOString().slice(0, 10);
  }
  function render() {
    view.innerHTML = '<section><span class="eyebrow">' + fcEsc(fcTitle()) + '</span>' +
      '<h2>Audience questions</h2><p class="hint">' + aq.length + ' questions · ' + aq.reduce((s, a) => s + a.votes, 0) + ' votes · ' + stamp + '</p>' +
      '<div class="row mt"><button class="btn primary" onclick="dlCsv()">CSV</button>' +
      '<button class="btn" onclick="dlMd()">Markdown</button><button class="btn ghost" onclick="reloadR()">Refresh</button></div></section>' +
      '<section class="block"><div class="rows">' + (aq.length ? aq.map((it) =>
        '<div class="rowi' + (it.status === "dismissed" ? " off" : "") + '"><span class="lead num">' + it.votes + '</span>' +
        '<div class="body"><div class="ttl">' + fcEsc(it.text) + '</div>' +
        '<div class="sub">' + (it.author ? fcEsc(it.author) + ' · ' : '') + '<span class="marker">' + fcStatusLabel(it.status) + '</span></div></div></div>'
      ).join("") : fcEmpty("No questions yet.")) + '</div></section>';
  }
  function buildCsv() {
    const lines = [["votes", "question", "author", "status", "submitted_at"].join(",")];
    aq.forEach((it) => lines.push([it.votes, fcClean(it.text), it.author || "", it.status, it.created_at].map(fcCsvCell).join(",")));
    return lines.join("\n");
  }
  function buildMd() {
    let m = "# " + fcTitle() + ": audience questions\n\n_Exported " + stamp + "_\n\n";
    aq.forEach((it) => { m += "- **" + it.votes + "** " + fcClean(it.text) + (it.author ? " (" + it.author + ")" : "") + " _[" + fcStatusLabel(it.status) + "]_\n"; });
    return m;
  }
  window.dlCsv = () => fcDownload("fc-panel-questions-" + stamp + ".csv", buildCsv(), "text/csv");
  window.dlMd = () => fcDownload("fc-panel-questions-" + stamp + ".md", buildMd(), "text/markdown");
  window.reloadR = async () => { await load(); render(); };
  load().then(render);
}
</script>
</body>
</html>
