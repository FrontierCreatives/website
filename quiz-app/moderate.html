<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/quiz-app/" />
<title>Frontier Creatives · Moderator</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
<style>
  :root { --maxw: 820px; }
  .ctl { margin-top: 26px; }
  .ctl .lab { display: block; font-family: var(--fd); font-weight: 600; font-size: 13px; color: var(--text-3); margin-bottom: 8px; }
  .now .live-q { font-size: clamp(22px, 4vw, 34px); margin-top: 6px; }
  .util { margin-top: clamp(36px, 7vw, 64px); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .util .sp { flex: 1; }
  .rowi .acts .btn.sm { padding: 8px 12px; }
  a.btn { text-decoration: none; }
</style>
</head>
<body>
<div class="wash sand"></div>
<div id="app" class="wrap">
  <header class="top">
    <a class="wordmark" href="../"><img src="../assets/logo/fc-mark.svg" alt="" /><span>Frontier Creatives</span></a>
    <span class="ctx">Moderator</span>
  </header>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
fcInitTheme();
if (fcRequireConfig()) fcGate(startModerator);

function startModerator() {
  const view = document.getElementById("view");
  const sb = FC.client;
  let state = null, aq = [], confirmReset = false;

  async function load() {
    const { data: st } = await sb.from("quiz_state").select("*").eq("id", 1).single();
    state = st;
    aq = await fcLoadQuestions(sb, state && state.active_quiz_id);
  }
  async function setState(patch) {
    patch.updated_at = new Date().toISOString();
    await sb.from("quiz_state").update(patch).eq("id", 1);
    await refresh();
  }
  async function setAQ(id, status) {
    if (status === "live") {
      const { error } = await sb.rpc("set_live_question", { qid: id });
      if (error) {
        await sb.from("audience_questions").update({ status: "asked" }).eq("quiz_id", state.active_quiz_id).eq("status", "live");
        await sb.from("audience_questions").update({ status: "live" }).eq("id", id);
      }
      if (state.phase !== "panel") { await setState({ phase: "panel" }); return; }
    } else {
      await sb.from("audience_questions").update({ status }).eq("id", id);
    }
    await refresh();
  }
  async function doReset() {
    const { error } = await sb.rpc("reset_session");
    confirmReset = false;
    if (error) alert("Reset failed. Has reset.sql been run in Supabase? (" + error.message + ")");
    await refresh();
  }

  const PHASES = [["lobby", "Join screen"], ["qa", "The board"], ["panel", "On the floor"], ["ended", "End"]];

  function render() {
    if (!state) { view.innerHTML = '<p class="empty">Loading</p>'; return; }
    if (!state.active_quiz_id) {
      view.innerHTML = '<span class="eyebrow">No active event</span><h2>Nothing is live yet</h2>' +
        '<p class="hint">Run <b>seed.sql</b> in Supabase to create the event, then reload.</p>';
      return;
    }
    const seg = '<div class="seg">' + PHASES.map(([k, label]) =>
      '<button class="btn' + (state.phase === k ? " on" : "") + '" onclick="ph(\'' + k + '\')">' + label + '</button>').join("") + '</div>';
    const live = aq.find((a) => a.status === "live");
    const counts = { pending: 0, queued: 0, asked: 0, dismissed: 0 };
    aq.forEach((a) => { if (a.status in counts) counts[a.status]++; });
    const resetCtl = confirmReset
      ? '<span class="small">Clear every question and vote?</span>' +
        '<button class="btn sm primary" onclick="resetYes()">Yes, reset</button>' +
        '<button class="btn sm ghost" onclick="resetNo()">Cancel</button>'
      : '<button class="btn sm ghost" onclick="resetAsk()">Reset for next event</button>';

    const order = ["live", "queued", "pending", "asked", "dismissed"];
    const sorted = aq.slice().sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || b.votes - a.votes);

    view.innerHTML =
      '<section class="now"><span class="eyebrow">' + fcEsc(fcTitle()) + '</span>' +
        '<span class="marker' + (live ? " on" : "") + '">On the floor</span>' +
        '<div class="live-q">' + (live ? fcEsc(live.text) : '<span style="color:var(--text-3)">Nothing yet. Put a question on screen below.</span>') + '</div>' +
        (live && live.author ? '<div class="live-by">' + fcEsc(live.author) + '</div>' : '') +
        (live ? '<div class="row mt"><button class="btn" onclick="setAQ(\'' + live.id + '\',\'asked\')">Done, mark asked</button></div>' : '') +
        '<div class="ctl"><span class="lab">The screen shows</span>' + seg +
          '<p class="small" style="margin:8px 0 0">Phones can ask and vote in every state except End. The board reorders itself as votes land.</p></div>' +
      '</section>' +

      '<section class="block"><div class="spread"><span class="eyebrow" style="margin:0">Questions</span>' +
        '<span class="small">' + counts.pending + ' new · ' + counts.queued + ' queued · ' + counts.asked + ' asked</span></div>' +
        '<div class="rows mt">' + (sorted.length ? sorted.map((it) => {
          const cls = it.status === "live" ? "on" : it.status === "asked" ? "past" : it.status === "dismissed" ? "off" : "";
          const acts =
            (it.status !== "live" && it.status !== "dismissed" ? '<button class="btn sm' + (it.status === "queued" ? " primary" : "") + '" onclick="setAQ(\'' + it.id + '\',\'live\')">Put on screen</button>' : '') +
            (it.status === "pending" ? '<button class="btn sm" onclick="setAQ(\'' + it.id + '\',\'queued\')">Queue</button>' : '') +
            (it.status === "live" || it.status === "queued" ? '<button class="btn sm" onclick="setAQ(\'' + it.id + '\',\'asked\')">Asked</button>' : '') +
            (it.status !== "dismissed" ? '<button class="btn sm ghost" onclick="setAQ(\'' + it.id + '\',\'dismissed\')">Dismiss</button>'
                                       : '<button class="btn sm ghost" onclick="setAQ(\'' + it.id + '\',\'pending\')">Restore</button>');
          return '<div class="rowi ' + cls + '"><span class="lead num">' + it.votes + '</span>' +
            '<div class="body"><div class="ttl">' + fcEsc(it.text) + '</div>' +
            '<div class="sub">' + (it.author ? fcEsc(it.author) + ' · ' : '') + '<span class="marker' + (it.status === "live" ? " on" : "") + '">' + fcStatusLabel(it.status) + '</span></div></div>' +
            '<div class="acts">' + acts + '</div></div>';
        }).join("") : fcEmpty("No questions yet.")) + '</div></section>' +

      '<div class="util">' + resetCtl + '<span class="sp"></span>' +
        '<a class="btn sm" href="present.html" target="_blank" rel="noopener">Open the screen</a>' +
        '<a class="btn sm" href="results.html" target="_blank" rel="noopener">Export</a></div>';
  }

  window.setAQ = setAQ;
  window.ph = (p) => setState({ phase: p });
  window.resetAsk = () => { confirmReset = true; render(); };
  window.resetNo = () => { confirmReset = false; render(); };
  window.resetYes = () => doReset();

  async function refresh() { await load(); render(); }
  sb.channel("m_state").on("postgres_changes", { event: "*", schema: "public", table: "quiz_state" }, refresh).subscribe();
  sb.channel("m_aq").on("postgres_changes", { event: "*", schema: "public", table: "audience_questions" }, refresh).subscribe();
  refresh();
}
</script>
</body>
</html>
