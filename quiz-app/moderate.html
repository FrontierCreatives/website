<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/quiz-app/" />
<title>Frontier Creatives · Moderator</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
<style>
  :root { --maxw: 820px; }
  .ctl { margin-top: 26px; }
  .ctl .lab { display: block; font-family: var(--fd); font-weight: 600; font-size: 13px; color: var(--text-3); margin-bottom: 8px; }
  .now h2 { margin-top: 6px; }
  .count { color: var(--text-3); font-size: 15px; }
  .count b { color: var(--text); font-family: var(--fd); font-weight: 600; }
  .util { margin-top: clamp(36px, 7vw, 64px); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .util .sp { flex: 1; }
  .rowi .acts .btn.sm { padding: 8px 12px; }
  a.btn { text-decoration: none; }
</style>
</head>
<body>
<div class="wash sand"></div>
<div id="app" class="wrap">
  <header class="top">
    <a class="wordmark" href="../"><img src="../assets/logo/fc-mark.svg" alt="" /><span>Frontier Creatives</span></a>
    <span class="ctx">Moderator</span>
  </header>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
fcInitTheme();
if (fcRequireConfig()) fcGate(startModerator);

function startModerator() {
  const view = document.getElementById("view");
  const sb = FC.client;
  let state = null, quiz = null, questions = [], q = null, count = 0, aq = [], confirmReset = false;

  async function loadAll() {
    const { data: st } = await sb.from("quiz_state").select("*").eq("id", 1).single();
    state = st;
    if (state?.active_quiz_id) {
      quiz = (await sb.from("quizzes").select("*").eq("id", state.active_quiz_id).single()).data;
      questions = (await sb.from("questions").select("*").eq("quiz_id", state.active_quiz_id).order("sort_order")).data || [];
      q = questions.find((x) => x.id === state.current_question_id) || null;
      const { count: c } = q
        ? await sb.from("responses").select("*", { count: "exact", head: true }).eq("question_id", q.id)
        : { count: 0 };
      count = c || 0;
      aq = (await sb.from("audience_questions").select("*").eq("quiz_id", state.active_quiz_id)
        .order("votes", { ascending: false }).order("created_at")).data || [];
    } else { quiz = null; questions = []; q = null; aq = []; }
  }

  async function setState(patch) {
    patch.updated_at = new Date().toISOString();
    await sb.from("quiz_state").update(patch).eq("id", 1);
    await refresh();
  }
  const goTo = (qid) => setState({ current_question_id: qid, phase: state.phase === "panel" ? "panel" : "question" });
  function step(d) {
    const i = questions.findIndex((x) => x.id === q?.id);
    const n = questions[Math.max(0, Math.min(questions.length - 1, i + d))];
    if (n) goTo(n.id);
  }
  async function setAQ(id, status) {
    if (status === "live") {
      const { error } = await sb.rpc("set_live_question", { qid: id });
      if (error) {
        // Fallback without the RPC: demote the current live one, then promote.
        await sb.from("audience_questions").update({ status: "asked" }).eq("quiz_id", state.active_quiz_id).eq("status", "live");
        await sb.from("audience_questions").update({ status: "live" }).eq("id", id);
      }
    } else {
      await sb.from("audience_questions").update({ status }).eq("id", id);
    }
    await refresh();
  }
  async function doReset() {
    const { error } = await sb.rpc("reset_session");
    confirmReset = false;
    if (error) alert("Reset failed. Has reset.sql been run in Supabase? (" + error.message + ")");
    await refresh();
  }

  const PHASES = [["lobby", "Lobby"], ["question", "Voting"], ["results", "Results"], ["qa", "Q&A"], ["panel", "Panel"], ["ended", "End"]];
  const MODES = [["bar", "Bar"], ["pie", "Pie"], ["cloud", "Cloud"]];

  function render() {
    if (!state) { view.innerHTML = '<p class="empty">Loading</p>'; return; }
    if (!quiz) {
      view.innerHTML = '<span class="eyebrow">No active quiz</span><h2>Nothing is live yet</h2>' +
        '<p class="hint">Run <b>seed.sql</b> in Supabase to load a quiz, then reload.</p>';
      return;
    }
    const idx = questions.findIndex((x) => x.id === q?.id);
    const phase = state.phase, mode = state.display_mode;
    const seg = (items, cur, fn) => '<div class="seg">' + items.map(([k, label]) =>
      '<button class="btn' + (cur === k ? " on" : "") + '" onclick="' + fn + '(\'' + k + '\')">' + label + '</button>').join("") + '</div>';

    const resetCtl = confirmReset
      ? '<span class="small">Clear every answer and audience question?</span>' +
        '<button class="btn sm primary" onclick="resetYes()">Yes, reset</button>' +
        '<button class="btn sm ghost" onclick="resetNo()">Cancel</button>'
      : '<button class="btn sm ghost" onclick="resetAsk()">Reset for next event</button>';

    const live = aq.filter((a) => a.status === "live").length;
    const pending = aq.filter((a) => a.status === "pending").length;
    const queued = aq.filter((a) => a.status === "queued").length;

    view.innerHTML =
      '<section class="now"><span class="eyebrow">' + fcEsc(quiz.title) + '</span>' +
        '<h2>' + (q ? (idx + 1) + '. ' + fcEsc(q.prompt) : 'No question selected') + '</h2>' +
        '<p class="count"><b id="respCount">' + count + '</b> ' + (count === 1 ? "answer" : "answers") + ' to this question</p>' +
        '<div class="row mt">' +
          '<button class="btn" onclick="step(-1)" ' + (idx <= 0 ? "disabled" : "") + '>Previous</button>' +
          '<button class="btn primary" onclick="step(1)" ' + (idx >= questions.length - 1 ? "disabled" : "") + '>Next question</button>' +
        '</div>' +
        '<div class="ctl"><span class="lab">The room is in</span>' + seg(PHASES, phase, "ph") + '</div>' +
        '<div class="ctl"><span class="lab">Screen shows</span>' + seg(MODES, mode, "dm") +
          '<p class="small" style="margin:8px 0 0">One-word questions always show a cloud.</p></div>' +
      '</section>' +

      '<section class="block"><span class="eyebrow">Questions</span><div class="rows">' +
        questions.map((x, i) =>
          '<button class="rowi' + (x.id === q?.id ? " on" : "") + '" onclick="goTo(\'' + x.id + '\')">' +
          '<span class="lead">' + (i + 1) + '</span><div class="body"><div class="ttl">' + fcEsc(x.prompt) + '</div>' +
          '<div class="sub">' + ({ single: "Pick one", multi: "Pick many", word: "One word" }[x.type] || x.type) + '</div></div></button>'
        ).join("") + '</div></section>' +

      '<section class="block"><div class="spread"><span class="eyebrow" style="margin:0">Audience questions</span>' +
        '<span class="small">' + pending + ' new · ' + queued + ' queued' + (live ? ' · 1 on the floor' : '') + '</span></div>' +
        '<div class="rows mt">' + (aq.length ? aq.map((it) => {
          const cls = it.status === "live" ? "on" : it.status === "asked" ? "past" : it.status === "dismissed" ? "off" : "";
          const acts =
            (it.status !== "live" && it.status !== "dismissed" ? '<button class="btn sm' + (it.status === "queued" ? " primary" : "") + '" onclick="setAQ(\'' + it.id + '\',\'live\')">Put on screen</button>' : '') +
            (it.status === "pending" ? '<button class="btn sm" onclick="setAQ(\'' + it.id + '\',\'queued\')">Queue</button>' : '') +
            (it.status === "live" || it.status === "queued" ? '<button class="btn sm" onclick="setAQ(\'' + it.id + '\',\'asked\')">Asked</button>' : '') +
            (it.status !== "dismissed" ? '<button class="btn sm ghost" onclick="setAQ(\'' + it.id + '\',\'dismissed\')">Dismiss</button>'
                                       : '<button class="btn sm ghost" onclick="setAQ(\'' + it.id + '\',\'pending\')">Restore</button>');
          return '<div class="rowi ' + cls + '"><span class="lead num">' + it.votes + '</span>' +
            '<div class="body"><div class="ttl">' + fcEsc(it.text) + '</div>' +
            '<div class="sub">' + (it.author ? fcEsc(it.author) + ' · ' : '') + '<span class="marker' + (it.status === "live" ? " on" : "") + '">' + fcStatusLabel(it.status) + '</span></div></div>' +
            '<div class="acts">' + acts + '</div></div>';
        }).join("") : '<p class="empty">No audience questions yet.</p>') + '</div></section>' +

      '<div class="util">' + resetCtl + '<span class="sp"></span>' +
        '<a class="btn sm" href="present.html" target="_blank" rel="noopener">Open the screen</a>' +
        '<a class="btn sm" href="results.html" target="_blank" rel="noopener">Export results</a></div>';
  }

  window.step = step; window.goTo = goTo; window.setAQ = setAQ;
  window.ph = (p) => setState({ phase: p });
  window.dm = (m) => setState({ display_mode: m });
  window.resetAsk = () => { confirmReset = true; render(); };
  window.resetNo = () => { confirmReset = false; render(); };
  window.resetYes = () => doReset();

  async function refresh() { await loadAll(); render(); }

  sb.channel("m_state").on("postgres_changes", { event: "*", schema: "public", table: "quiz_state" }, refresh).subscribe();
  sb.channel("m_resp").on("postgres_changes", { event: "INSERT", schema: "public", table: "responses" }, (p) => {
    if (q && p.new && p.new.question_id === q.id) { count++; const el = document.getElementById("respCount"); if (el) el.textContent = count; }
  }).subscribe();
  sb.channel("m_aq").on("postgres_changes", { event: "*", schema: "public", table: "audience_questions" }, refresh).subscribe();

  refresh();
}
</script>
</body>
</html>
