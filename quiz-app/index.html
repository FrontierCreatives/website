<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<base href="/quiz-app/" />
<title>Frontier Creatives · Vol. 04 panel</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
<style>
  :root { --maxw: 560px; }
  .lobby { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; }
  .lobby .markwrap { margin: 40px calc(-1 * clamp(16px, 4vw, 40px)) 0; }
  .lobby .markwrap video, .lobby .markwrap img { width: 100%; height: auto; display: block; }
  .live-now .live-q { font-size: clamp(22px, 6vw, 30px); }
  .ask h1 { font-size: clamp(26px, 7vw, 34px); }
  .sent { color: var(--acc); font-size: 15px; margin-top: 10px; min-height: 1.4em; }
  .askrow { flex-wrap: nowrap; }
  .askrow input { flex: 1 1 0; min-width: 0; }
  .askrow .btn { flex: 0 0 auto; }
  @media (max-width: 359px) { .askrow { flex-wrap: wrap; } .askrow input, .askrow .btn { flex: 1 1 100%; } }
</style>
</head>
<body>
<div class="wash"></div>
<div id="app" class="wrap">
  <header class="top">
    <a class="wordmark" href="../"><img src="../assets/logo/fc-mark.svg" alt="" /><span>Frontier Creatives</span></a>
    <span class="ctx">Live</span>
  </header>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
fcInitTheme();
if (fcRequireConfig()) {
  const view = document.getElementById("view");
  const sb = FC.client;
  fcParticipantId();
  let state = null, aq = [], note = "";

  const votedKey = (id) => "fc-voted-" + id;
  const mineSet = (() => { try { return new Set(JSON.parse(localStorage.getItem("fc-mine") || "[]")); } catch (e) { return new Set(); } })();
  const rememberMine = (id) => { mineSet.add(id); try { localStorage.setItem("fc-mine", JSON.stringify([...mineSet])); } catch (e) {} };
  const savedName = (() => { try { return localStorage.getItem("fc-name") || ""; } catch (e) { return ""; } })();
  const hasVoted = (id) => { try { return !!localStorage.getItem(votedKey(id)); } catch (e) { return false; } };

  async function load() {
    const { data } = await sb.from("quiz_state").select("*").eq("id", 1).single();
    state = data;
    aq = await fcLoadQuestions(sb, state && state.active_quiz_id, ["pending", "queued", "live"]);
  }

  function liveBlock() {
    const live = aq.find((it) => it.status === "live");
    if (!live) return "";
    return '<section class="block live-now"><span class="eyebrow">On the floor</span>' +
      '<div class="live-q">' + fcEsc(live.text) + '</div>' +
      (live.author ? '<div class="live-by">' + fcEsc(live.author) + '</div>' : '') + '</section>';
  }
  function askBlock() {
    return '<section class="block ask"><span class="eyebrow">' + fcEsc(fcTitle()) + '</span>' +
      '<h1>Ask the panel</h1>' +
      '<p class="hint">Ask a question, or vote for the ones you want answered. The board updates as you tap.</p>' +
      '<div class="mt"><textarea id="qText" rows="2" maxlength="240" placeholder="Got a question?"></textarea></div>' +
      '<div class="row mt askrow"><input id="qName" type="text" maxlength="40" placeholder="Name (optional)" value="' + fcEsc(savedName) + '" autocomplete="name" />' +
      '<button class="btn primary" id="sendBtn" onclick="askQ()">Send</button></div>' +
      '<div class="sent" id="sent">' + fcEsc(note) + '</div></section>';
  }
  function listBlock() {
    const items = aq.filter((it) => it.status !== "live");
    return '<section class="block"><span class="eyebrow muted">The board</span>' +
      '<div class="rows" id="qlist">' + (items.length ? items.map((it) => {
        const mine = hasVoted(it.id);
        const cls = it.status === "asked" ? "past" : "";
        return '<div class="rowi ' + cls + '">' +
          '<button class="vote' + (mine ? " mine" : "") + '" onclick="upvote(\'' + it.id + '\')" aria-label="Upvote">' + FC_CHEV +
            '<span class="n">' + it.votes + '</span><span class="l">votes</span></button>' +
          '<div class="body"><div class="ttl">' + fcEsc(it.text) + '</div>' +
          '<div class="sub">' + (it.author ? fcEsc(it.author) : '') +
          (mineSet.has(it.id) ? (it.author ? ' · ' : '') + '<span class="marker on">Yours</span>' : '') + '</div></div></div>';
      }).join("") : fcEmpty("No questions yet. Yours could be first.")) + '</div></section>';
  }

  function render() {
    if (!state) { view.innerHTML = '<p class="empty">Connecting</p>'; return; }
    document.body.classList.toggle("ended", state.phase === "ended");
    if (state.phase === "ended") {
      view.innerHTML = '<section class="lobby"><span class="eyebrow">' + fcEsc(fcTitle()) + '</span>' +
        '<h1>That&rsquo;s a wrap</h1><p class="lede">Thanks for the questions. Stay for the room.</p>' +
        '<div class="markwrap">' + fcAnimatedMark("band") + '</div></section>';
      fcWatchMark(view);
      return;
    }
    const hadName = document.getElementById("qName");
    const keep = { t: (document.getElementById("qText") || {}).value || "", n: hadName ? hadName.value : savedName };
    view.innerHTML = liveBlock() + askBlock() + listBlock();
    const t = document.getElementById("qText"), n = document.getElementById("qName");
    if (t) t.value = keep.t; if (n) n.value = keep.n;
  }

  window.askQ = async function () {
    const t = document.getElementById("qText").value.trim();
    if (!t) return;
    const name = document.getElementById("qName").value.trim() || null;
    if (fcBlocked(t) || (name && fcBlocked(name))) { note = "Let\u2019s keep it on topic."; render(); return; }
    const btn = document.getElementById("sendBtn"); btn.disabled = true;
    const { data, error } = await sb.from("audience_questions").insert([{ quiz_id: state.active_quiz_id, text: t.slice(0, 240), author: name }]).select();
    btn.disabled = false;
    if (error) { note = "That didn\u2019t go through. Try again."; render(); return; }
    if (data && data[0]) rememberMine(data[0].id);
    try { localStorage.setItem("fc-name", name || ""); } catch (e) {}
    document.getElementById("qText").value = "";
    note = "Sent. It\u2019s on the board.";
    await load(); render();
    setTimeout(() => { note = ""; const el = document.getElementById("sent"); if (el) el.textContent = ""; }, 4000);
  };
  window.upvote = async function (id) {
    if (hasVoted(id)) return;
    try { localStorage.setItem(votedKey(id), "1"); } catch (e) {}
    const { error } = await sb.rpc("upvote_question", { qid: id });
    if (error) await sb.from("audience_questions").update({ votes: (aq.find((a) => a.id === id)?.votes || 0) + 1 }).eq("id", id);
    await load(); render();
  };

  async function refresh() { await load(); render(); }
  sb.channel("state").on("postgres_changes", { event: "*", schema: "public", table: "quiz_state" }, refresh).subscribe();
  sb.channel("aq").on("postgres_changes", { event: "*", schema: "public", table: "audience_questions" }, refresh).subscribe();
  refresh();
}
</script>
</body>
</html>
