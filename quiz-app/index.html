<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Frontier Creatives — Live Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app" class="wrap">
  <div class="mast">
    <div class="brand">
      <span class="mark">Frontier <b>Creatives</b></span>
      <span class="tag">Live</span>
    </div>
    <button id="themeToggle" class="theme-toggle">◑ Light</button>
  </div>
  <div id="view"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
fcInitTheme();
if (fcRequireConfig()) {
  const view = document.getElementById("view");
  const sb = FC.client;
  const pid = fcParticipantId();
  let state = null, questions = [], q = null, rows = [], selection = new Set();

  const answeredKey = (qid) => "fc-ans-" + qid;
  const hasAnswered = (qid) => { try { return !!localStorage.getItem(answeredKey(qid)); } catch (e) { return false; } };
  const markAnswered = (qid) => { try { localStorage.setItem(answeredKey(qid), "1"); } catch (e) {} };

  async function loadState() {
    const { data } = await sb.from("quiz_state").select("*").eq("id", 1).single();
    state = data;
    if (state && state.active_quiz_id) {
      const { data: qs } = await sb.from("questions").select("*")
        .eq("quiz_id", state.active_quiz_id).order("sort_order");
      questions = qs || [];
    } else { questions = []; }
    q = questions.find((x) => x.id === state?.current_question_id) || null;
  }

  async function loadRows() {
    if (!q) { rows = []; return; }
    const { data } = await sb.from("responses").select("id,answer").eq("question_id", q.id);
    rows = data || [];
  }

  async function submit() {
    if (!q || hasAnswered(q.id)) return;
    let answers = [];
    if (q.type === "word") {
      const v = document.getElementById("wordInput").value.trim();
      if (!v) return;
      answers = [v.slice(0, 40)];
    } else {
      answers = [...selection];
      if (!answers.length) return;
      const oi = document.getElementById("otherInput");
      const otherText = oi ? oi.value.trim().slice(0, 60) : "";
      answers = answers.map((a) => (a.toLowerCase().startsWith("other") && otherText) ? a + ": " + otherText : a);
    }
    const payload = answers.map((a) => ({ question_id: q.id, participant_id: pid, answer: a }));
    const { error } = await sb.from("responses").insert(payload);
    if (error) { alert("Could not submit — try again."); return; }
    markAnswered(q.id);
    selection.clear();
    await loadRows();
    render();
  }

  function render() {
    if (!state) { view.innerHTML = '<div class="card center"><p class="hint">Connecting…</p></div>'; return; }
    const phase = state.phase;

    if (phase === "lobby" || !q) {
      view.innerHTML = '<div class="card center stack" style="padding:48px 24px">' +
        '<p class="eyebrow">Get ready</p>' +
        '<h2 style="font-size:1.8rem;margin:0">The quiz is about to begin</h2>' +
        '<p class="hint">Keep this page open — questions will appear here.</p></div>';
      return;
    }

    if (phase === "ended") {
      view.innerHTML = '<div class="card center stack" style="padding:48px 24px">' +
        '<p class="eyebrow">That\'s a wrap</p>' +
        '<h2 style="font-size:1.8rem;margin:0">Thanks for playing</h2>' +
        '<p class="hint">See the screen for final results.</p></div>';
      return;
    }

    if (phase === "qa") { renderQA(); return; }

    // question / results
    const answered = hasAnswered(q.id);
    const locked = answered || phase === "results";
    const idx = questions.findIndex((x) => x.id === q.id) + 1;

    if (!locked) {
      let body;
      if (q.type === "word") {
        body = '<input id="wordInput" type="text" maxlength="40" placeholder="Type one word…" autocomplete="off" />' +
          '<button class="btn primary mt" style="width:100%" onclick="submit()">Send</button>';
      } else {
        const multi = q.type === "multi";
        const hasOther = q.options.some((o) => o.toLowerCase().startsWith("other"));
        body = '<div class="options">' + q.options.map((o, i) =>
          '<button class="opt" data-o="' + fcEsc(o) + '" onclick="pick(this)"><span class="dot"></span>' + fcEsc(o) + '</button>'
        ).join("") + '</div>' +
          (hasOther ? '<div id="otherWrap" class="hide" style="margin-top:12px">' +
            '<input id="otherInput" type="text" maxlength="60" placeholder="Please specify…" autocomplete="off" />' +
            (multi ? '' : '<button class="btn primary mt" style="width:100%" onclick="submit()">Send</button>') +
          '</div>' : '') +
          (multi ? '<button class="btn primary mt" style="width:100%" onclick="submit()">Submit choices</button>'
                 : '<p class="hint center mt">Tap an answer to lock it in.</p>');
      }
      view.innerHTML = '<div class="card">' +
        '<p class="eyebrow">Question ' + idx + ' of ' + questions.length + '</p>' +
        '<h2 class="prompt">' + fcEsc(q.prompt) + '</h2>' + body + '</div>';
      const oi = document.getElementById("otherInput");
      if (oi && q.type !== "multi") oi.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    } else {
      view.innerHTML = '<div class="card">' +
        '<p class="eyebrow">' + (phase === "results" ? "Results" : "Locked in") + '</p>' +
        '<h2 class="prompt">' + fcEsc(q.prompt) + '</h2>' +
        (phase === "results" ? "" : '<p class="hint">Your answer is in — watch the big screen.</p>') +
        '<div id="mini" class="mt"></div></div>';
      fcRenderChart(q.type === "word" ? "cloud" : "bar", document.getElementById("mini"), q, rows);
    }
  }

  function renderQA() {
    sb.from("audience_questions").select("*").eq("quiz_id", state.active_quiz_id)
      .in("status", ["pending", "queued", "asked"]).order("votes", { ascending: false })
      .order("created_at").then(({ data }) => {
        const items = data || [];
        view.innerHTML = '<div class="card">' +
          '<p class="eyebrow">Ask the presenters</p>' +
          '<h2 class="prompt" style="font-size:1.6rem">Your questions</h2>' +
          '<textarea id="qText" rows="2" maxlength="240" placeholder="Type your question…"></textarea>' +
          '<div class="row mt"><input id="qName" type="text" placeholder="Your name (optional)" style="flex:1" />' +
          '<button class="btn primary" onclick="askQ()">Send</button></div>' +
          '<div class="qlist" id="qlist">' + items.map((it) =>
            '<div class="qitem">' +
              '<button class="vote btn ghost sm" onclick="upvote(\'' + it.id + '\',' + it.votes + ')">' +
                '<span>▲</span><span class="n">' + it.votes + '</span></button>' +
              '<div class="txt">' + fcEsc(it.text) +
                (it.author ? '<div class="who">— ' + fcEsc(it.author) + '</div>' : '') +
                (it.status !== "pending" ? '<span class="pill ' + it.status + '">' + it.status + '</span>' : '') +
              '</div></div>'
          ).join("") + '</div></div>';
      });
  }

  function toggleOther(show) {
    const w = document.getElementById("otherWrap");
    if (!w) return;
    w.classList.toggle("hide", !show);
    if (show) { const oi = document.getElementById("otherInput"); if (oi) oi.focus(); }
  }
  window.pick = function (btn) {
    const val = btn.getAttribute("data-o");
    const isOther = val.toLowerCase().startsWith("other");
    if (q.type === "multi") {
      if (selection.has(val)) { selection.delete(val); btn.classList.remove("chosen"); }
      else { selection.add(val); btn.classList.add("chosen"); }
      toggleOther([...selection].some((v) => v.toLowerCase().startsWith("other")));
    } else {
      document.querySelectorAll(".opt").forEach((b) => b.classList.remove("chosen"));
      btn.classList.add("chosen");
      selection = new Set([val]);
      if (isOther) toggleOther(true);
      else { toggleOther(false); submit(); }
    }
  };
  window.submit = submit;
  window.askQ = async function () {
    const t = document.getElementById("qText").value.trim();
    if (!t) return;
    const name = document.getElementById("qName").value.trim() || null;
    await sb.from("audience_questions").insert([{ quiz_id: state.active_quiz_id, text: t.slice(0, 240), author: name }]);
    document.getElementById("qText").value = "";
    renderQA();
  };
  window.upvote = async function (id, cur) {
    const key = "fc-voted-" + id;
    try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch (e) {}
    await sb.from("audience_questions").update({ votes: cur + 1 }).eq("id", id);
    renderQA();
  };

  async function refresh() { await loadState(); await loadRows(); render(); }

  sb.channel("state").on("postgres_changes", { event: "*", schema: "public", table: "quiz_state" }, refresh).subscribe();
  sb.channel("resp").on("postgres_changes", { event: "INSERT", schema: "public", table: "responses" }, (p) => {
    if (q && p.new && p.new.question_id === q.id) {
      if (!rows.some((r) => r.id === p.new.id)) rows.push({ id: p.new.id, answer: p.new.answer });
      if (hasAnswered(q.id) || state.phase === "results") render();
    }
  }).subscribe();
  sb.channel("aq").on("postgres_changes", { event: "*", schema: "public", table: "audience_questions" }, () => {
    if (state && state.phase === "qa") renderQA();
  }).subscribe();

  refresh();
}
</script>
</body>
</html>
