<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/quiz-app/" />
<title>Frontier Creatives · Vol. 04 panel · screen</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
<style>
  :root { --maxw: 1640px; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1; display: flex; flex-direction: column; width: 100%; padding-bottom: 24px; }
  .wrap { padding-top: clamp(28px, 5vh, 64px); }
  .foot .ctx { font-size: 12px; }
  .ctx { font-size: 13px; }
  .field.bg { position: fixed; z-index: 0; }
  /* content protection, the main site's #hlayer: measured bars between the field and the type */
  #hlayer { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #view { flex: 1; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .screen h1 { font-size: clamp(32px, 4.2vw, 68px); }
  .screen .eyebrow { font-size: clamp(13px, 1vw, 17px); margin-bottom: clamp(12px, 1.6vh, 22px); }
  .screen .lede { font-size: clamp(18px, 1.6vw, 28px); }
  .foot { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: baseline; gap: 8px 28px; color: var(--text-3); font-size: clamp(14px, 1.1vw, 19px); padding: 12px clamp(16px, 4vw, 40px) calc(22px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }
  .foot > span { white-space: nowrap; }
  .foot > span:nth-child(2) { white-space: normal; overflow-wrap: anywhere; }
  @media (max-width: 700px) { .foot .ctx { display: none; } .lobby .qrwrap { justify-content: flex-start; } }
  .foot b { color: var(--text-2); font-family: var(--fd); font-weight: 500; }
  .foot .n { color: var(--text); }

  /* lobby: words left, QR on the cardioid right */
  .lobby { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(24px, 4vw, 80px); align-items: center; min-height: 60vh; }
  .lobby .qrwrap { display: flex; justify-content: center; align-items: center; min-height: 420px; }
  /* the wrap: words left; the loop pinned to the viewport, nearly full height, nudged in from the right edge */
  .wrapup { grid-template-columns: 1fr; }
  .wrapup .markwrap { position: fixed; top: 50%; right: 7vw; transform: translateY(-50%); z-index: 0; pointer-events: none; }
  .wrapup .markwrap video, .wrapup .markwrap img { height: min(95vh, 58vw); width: auto; display: block; }
  .wrapup > div:first-child { position: relative; z-index: 1; max-width: 40vw; }
  body.ended { overflow: hidden; }
  .lobby .url { font-family: var(--fd); font-weight: 600; font-size: clamp(18px, 1.6vw, 28px); margin-top: 22px; color: var(--text); letter-spacing: -.01em; }

  /* the board: a live leaderboard, with a small QR to keep the door open */
  .board { display: grid; grid-template-columns: 1fr auto; gap: clamp(24px, 4vw, 80px); align-items: start; }
  .board .rowi { padding: clamp(10px, 1.4vh, 20px) 0; gap: clamp(16px, 2vw, 32px); align-items: baseline; transition: transform .4s var(--ease); }
  .board .rowi .lead { font-size: clamp(18px, 1.6vw, 30px); min-width: 2.2em; color: var(--acc); padding-top: 0; }
  .board .rowi .ttl { font-size: clamp(20px, 1.9vw, 34px); font-weight: 600; }
  .board .rowi .sub { font-size: clamp(14px, 1.1vw, 19px); }
  .board .rowi.past .ttl { color: var(--text-3); font-weight: 500; }
  .board .side { text-align: left; padding-top: 6px; }
  .board .side .small { display: block; margin-top: 12px; max-width: 220px; line-height: 1.4; }

  /* panel: the one on the floor, and what is coming */
  .panel { display: grid; grid-template-columns: 1.2fr .8fr; gap: clamp(28px, 5vw, 96px); align-items: start; padding-top: clamp(8px, 4vh, 48px); }
  .panel .side { display: flex; flex-direction: column; gap: clamp(20px, 4vh, 44px); }
  .panel .side .eyebrow { margin-bottom: 8px; }
  .panel .live-q { font-size: clamp(32px, 4vw, 72px); overflow-wrap: anywhere; }
  .panel .live-q.long { font-size: clamp(26px, 3vw, 54px); }
  .panel .live-q.xlong { font-size: clamp(22px, 2.4vw, 42px); line-height: 1.14; }
  .panel .live-by { overflow-wrap: anywhere; }
  .panel .next .rowi { padding: 10px 0; align-items: baseline; }
  .panel .next .rowi .ttl { font-size: clamp(18px, 1.6vw, 28px); font-weight: 500; color: var(--text-2); }
  .panel .next .rowi .lead { min-width: 2.2em; font-size: clamp(14px, 1.1vw, 20px); padding-top: 0; color: var(--acc); }
  .panel .side .qr { margin-top: 18px; }

  @media (max-width: 1000px) {
    .lobby, .board, .panel { grid-template-columns: 1fr; }
    .lobby .qrwrap { min-height: 0; justify-content: flex-start; }
    .board .side { display: none; }
  }
</style>
</head>
<body>
<div class="wash"></div>
<div class="field bg" id="bgField" aria-hidden="true"></div>
<svg id="hlayer" aria-hidden="true"></svg>
<div class="wrap">
  <main id="view"></main>
</div>
<footer class="foot">
  <span class="ctx" id="footTitle"></span>
  <span>Ask at <b id="joinUrl"></b></span>
  <span><span id="qCount" class="n num">0</span> <span id="qLabel">questions</span></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
fcInitTheme();
fcJig();
if (fcRequireConfig()) {
  const view = document.getElementById("view");
  const sb = FC.client;
  const joinURL = new URL("./", location.href).href;
  const joinText = joinURL.replace(/^https?:\/\//, "").replace(/\/$/, "");
  document.getElementById("joinUrl").textContent = joinText;
  let state = null, aq = [];

  // Placeholder the QR mounts into after innerHTML is set (a canvas cannot be serialized).
  const qrSlot = (size) => '<div class="qrslot" data-size="' + size + '"></div>';
  function mountQRs() { view.querySelectorAll(".qrslot").forEach((el) => fcMountQR(el, joinURL, parseInt(el.dataset.size, 10))); }
  async function load() {
    const { data } = await sb.from("quiz_state").select("*").eq("id", 1).single();
    state = data;
    aq = await fcLoadQuestions(sb, state && state.active_quiz_id, ["pending", "queued", "live"]);
  }

  const setStatus = (t) => { document.getElementById("footTitle").textContent = fcClean(fcTitle()) + " · " + t; };
  let bgName = null;
  function setBg(name, o) {
    const host = document.getElementById("bgField");
    if (!name) { host.innerHTML = ""; bgName = null; return; }
    if (bgName === name) return;
    bgName = name;
    fcField(host, name, Object.assign({ box: [1920, 1080] }, o));
  }
  function setCount() {
    const n = aq.filter((i) => i.status !== "dismissed").length;
    document.getElementById("qCount").textContent = n;
    document.getElementById("qLabel").textContent = n === 1 ? "question" : "questions";
  }
  function qRow(it, cls) {
    return '<div class="rowi ' + (cls || "") + '" data-id="' + it.id + '"><span class="lead num">' + it.votes + '</span>' +
      '<div class="body"><div class="ttl">' + fcEsc(it.text) + '</div>' +
      (it.author || it.status === "asked" ? '<div class="sub">' + (it.author ? fcEsc(it.author) : '') +
        (it.status === "asked" ? (it.author ? ' · ' : '') + '<span class="marker">Asked</span>' : '') + '</div>' : '') +
      '</div></div>';
  }

  function render() {
    setCount();
    if (!state) return;
    const phase = state.phase;
    document.body.classList.toggle("ended", state.phase === "ended");
    const title = fcEsc(fcTitle());

    if (phase === "ended") {
      setStatus("Ended");
      view.innerHTML = '<section class="screen lobby wrapup"><div><span class="eyebrow">' + title + '</span>' +
        '<h1>That&rsquo;s a wrap</h1><p class="lede">Thanks for the questions. Stay for the room.</p></div>' +
        '<div class="markwrap" data-jig="wrap-loop">' + fcAnimatedMark() + '</div></section>';
      fcWatchMark(view);
      setBg(null);
      return;
    }
    if (phase === "panel") {
      setStatus("On the floor");
      setBg(null);
      const live = aq.find((i) => i.status === "live");
      const next = aq.filter((i) => i.status === "queued" || i.status === "pending").slice(0, 4);
      view.innerHTML = '<section class="screen panel"><div>' +
        '<span class="eyebrow">On the floor</span>' +
        (live ? '<div class="live-q' + (live.text.length > 200 ? " xlong" : live.text.length > 110 ? " long" : "") + '">' + fcEsc(live.text) + '</div>' + (live.author ? '<div class="live-by">' + fcEsc(live.author) + '</div>' : '')
              : '<div class="live-q" style="color:var(--text-2)">Picking the next question.</div>') +
        '</div><div class="side">' +
        '<div class="next"><span class="eyebrow muted">Up next</span>' +
          (next.length ? '<div class="rows">' + next.map((it) => qRow(it)).join("") + '</div>' : '<p class="empty" style="padding:6px 0">The board is empty. Ask from your phone.</p>') + '</div>' +
        '<div data-jig="floor-qr"><span class="eyebrow muted">Add yours</span>' + qrSlot(140) + '</div>' +
        '</div></section>';
      mountQRs();
      return;
    }
    if (phase === "lobby" || !aq.length) {
      setStatus("Open");
      view.innerHTML = '<section class="screen lobby"><div><span class="eyebrow">' + title + '</span>' +
        '<h1>What do you want to ask the panel?</h1><p class="lede">Scan to send a question, then vote for the ones you want answered. Most votes go first.</p>' +
        '<div class="url">' + fcEsc(joinText) + '</div></div>' +
        '<div class="qrwrap" data-jig="join-qr">' + qrSlot(Math.round(Math.min(380, Math.max(220, innerWidth * .2)))) + '</div></section>';
      mountQRs();
      setBg(null);
      return;
    }
    // board: the live leaderboard
    setStatus("The board");
    setBg(null);
    const live = aq.filter((i) => i.status === "live");
    const open = aq.filter((i) => i.status === "queued" || i.status === "pending");
    const rows = live.map((it) => qRow(it, "on")).concat(open.map((it) => qRow(it))).slice(0, 8);
    view.innerHTML = '<section class="screen board"><div><span class="eyebrow">' + title + '</span>' +
      '<div class="rows">' + rows.join("") + '</div></div>' +
      '<div class="side" data-jig="board-qr"><span class="eyebrow muted">Ask or vote</span>' + qrSlot(170) +
      '<span class="small">' + fcEsc(joinText) + '</span></div></section>';
    mountQRs();
  }

  // A projector does not scroll: drop rows from the bottom until the page fits.
  function fit() {
    const lists = [...view.querySelectorAll(".rows")];
    view.querySelectorAll(".live-q").forEach((el) => { el.style.fontSize = ""; });
    let guard = 40;
    while (guard-- && document.documentElement.scrollHeight > innerHeight + 2) {
      const list = lists.find((l) => l.children.length > 1);
      if (!list) break;
      list.lastElementChild.remove();
    }
    const lq = view.querySelector(".live-q");
    let steps = 8;
    while (lq && steps-- && document.documentElement.scrollHeight > innerHeight + 2) {
      const cur = parseFloat(getComputedStyle(lq).fontSize);
      if (cur <= 20) break;
      lq.style.fontSize = (cur * .9).toFixed(1) + "px";
    }
  }
  // Content protection, as on the homepage: whenever a field is showing, draw a
  // background-colored bar under every text run so no line touches a glyph.
  // Measured with a Range (hugs the glyphs), fixed to the viewport, never inflates the page.
  const hlayer = document.getElementById("hlayer");
  function buildHL() {
    if (!hlayer) return;
    if (!bgName) { hlayer.innerHTML = ""; return; }
    const light = document.documentElement.getAttribute("data-theme") === "light";
    const fill = light ? "rgba(255,255,255,.92)" : "rgba(0,0,0,.94)";
    const out = [];
    document.querySelectorAll("#view .eyebrow, #view h1, #view .lede, #view .url, #view .live-q, #view .live-by, #view .ttl, #view .sub, #view .lead, #view .empty, .foot > span").forEach((el) => {
      const rg = document.createRange(); rg.selectNodeContents(el);
      for (const r of rg.getClientRects()) {
        if (r.width < 2 || r.height < 2) continue;
        const py = Math.round(r.height * .18), px = Math.round(r.height * .4);
        out.push('<rect x="' + (r.left - px).toFixed(1) + '" y="' + (r.top - py).toFixed(1) + '" width="' + (r.width + px * 2).toFixed(1) + '" height="' + (r.height + py * 2).toFixed(1) + '" rx="8" fill="' + fill + '"/>');
      }
    });
    hlayer.innerHTML = out.join("");
  }
  async function refresh() { await load(); render(); fit(); buildHL(); setTimeout(() => { fit(); buildHL(); }, 400); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { render(); fit(); buildHL(); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { render(); fit(); buildHL(); }, 150); });
  sb.channel("p_state").on("postgres_changes", { event: "*", schema: "public", table: "quiz_state" }, refresh).subscribe();
  sb.channel("p_aq").on("postgres_changes", { event: "*", schema: "public", table: "audience_questions" }, refresh).subscribe();
  refresh();
}
</script>
</body>
</html>
