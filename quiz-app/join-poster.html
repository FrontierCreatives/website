<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frontier Creatives — Join the Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --coral:#E76F51; --ink:#17120E; --sand:#F3EDE3; --surface:#FBF7F0; --muted:#8A7D6D; --line:rgba(23,18,14,.12); }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{ background:#e6ddd0; font-family:"Montserrat",system-ui,sans-serif; color:var(--ink);
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; }
  .poster{ width:680px; max-width:100%; aspect-ratio:17/22; background:var(--sand);
           border-radius:26px; box-shadow:0 24px 70px rgba(20,12,6,.22); overflow:hidden;
           display:flex; flex-direction:column; position:relative; }
  .accent{ height:14px; background:linear-gradient(90deg,var(--coral),#F0987F); }
  .inner{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center;
          padding:48px 54px 40px; }
  .brand{ font-family:"EB Garamond",Georgia,serif; font-size:34px; letter-spacing:.3px; }
  .brand b{ color:var(--coral); font-weight:600; }
  .brand .live{ display:inline-block; margin-left:8px; font-family:"Montserrat"; font-size:12px;
                letter-spacing:.22em; color:var(--muted); vertical-align:middle; }
  .eyebrow{ margin-top:34px; font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--coral); }
  h1{ font-family:"EB Garamond",Georgia,serif; font-weight:600; font-size:50px; line-height:1.05; margin:10px 0 0; }
  .qrwrap{ margin:36px 0 8px; background:#fff; padding:22px; border-radius:20px; box-shadow:0 8px 26px rgba(20,12,6,.12); }
  .qrwrap img{ display:block; width:100%; }
  .how{ font-size:17px; color:var(--ink); margin-top:6px; }
  .url{ margin-top:auto; font-weight:600; font-size:18px; color:var(--coral); letter-spacing:.01em; }
  .foot{ font-size:12.5px; color:var(--muted); margin-top:8px; letter-spacing:.04em; }
  @media print{ body{background:#fff;padding:0;} .poster{box-shadow:none;border:1px solid var(--line);} @page{margin:12mm;} }
</style>
</head>
<body>
  <div class="poster">
    <div class="accent"></div>
    <div class="inner">
      <div class="brand">Frontier <b>Creatives</b><span class="live">LIVE</span></div>
      <div class="eyebrow">Quiz of the day</div>
      <h1>Scan to join</h1>
      <div class="qrwrap"><img src="K5Aa80.png" alt="QR code to join the quiz" /></div>
      <div class="how">Point your phone camera at the code.<br/>No app needed.</div>
      <div class="url">frontiercreatives.design/quiz-app</div>
      <div class="foot">Answer a few questions &middot; watch the results live</div>
    </div>
  </div>
</body>
</html>
