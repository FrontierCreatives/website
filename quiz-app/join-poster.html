<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/quiz-app/" />
<title>Frontier Creatives · Join the room</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* A print piece, so it uses the light variant: warm paper, gray figure. */
  body { display: flex; align-items: center; justify-content: center; padding: 40px; background: #EFEAE1; }
  .poster { width: 680px; max-width: 100%; aspect-ratio: 17 / 22; background: var(--bg); position: relative; overflow: hidden;
            display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .poster .inner { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; padding: 56px 60px 48px; }
  .poster .wordmark { font-size: 20px; }
  .poster .wordmark img { width: 30px; height: 30px; }
  .poster .eyebrow { margin-top: 64px; }
  .poster h1 { font-size: 60px; }
  .poster .lede { font-size: 21px; max-width: 24ch; }
  .poster .qr { margin-top: 40px; box-shadow: none; align-self: flex-start; outline: 14px solid #fff; }
  .poster .url { margin-top: auto; font-family: var(--fd); font-weight: 600; font-size: 22px; letter-spacing: -.01em; color: var(--text); }
  .poster .foot { color: var(--text-3); font-size: 15px; margin-top: 6px; }
  @media print { body { background: #fff; padding: 0; } .poster { box-shadow: none; } @page { margin: 12mm; } }
</style>
</head>
<body>
  <div class="poster" id="poster">
    <div class="inner">
      <a class="wordmark" href="../"><img src="../assets/logo/fc-mark-light-bg.svg" alt="" /><span>Frontier Creatives</span></a>
      <span class="eyebrow">Vol. 04 · Interactive panel</span>
      <h1>Ask the panel</h1>
      <p class="lede">Scan, send a question, vote for the ones you want answered. No app, no login.</p>
      <div id="posterQR" aria-label="QR code to join"></div>
      <div class="url">frontiercreatives.design/quiz-app</div>
      <div class="foot">Most votes go first. The board on screen updates as you tap.</div>
    </div>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="lib.js"></script>
<script>
  document.documentElement.setAttribute("data-theme", "light");
  fcMountQR(document.getElementById("posterQR"), "https://www.frontiercreatives.design/quiz-app/", 250);
  fcField(document.getElementById("poster"), "cardioid", { box: [680, 880], scale: .95, rot: -20, cx: 780, cy: 470 });
</script>
</body>
</html>
