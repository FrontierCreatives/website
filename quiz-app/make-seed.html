<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/quiz-app/" />
<title>Frontier Creatives · Seed builder</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../favicon.svg" />
<link rel="stylesheet" href="styles.css" />
<style>
  :root { --maxw: 820px; }
  textarea.sql { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; white-space: pre; min-height: 420px; }
</style>
</head>
<body>
<div class="wash sand"></div>
<div class="wrap">
  <header class="top">
    <a class="wordmark" href="../"><img src="../assets/logo/fc-mark.svg" alt="" /><span>Frontier Creatives</span></a>
    <span class="ctx">Seed builder</span>
  </header>
  <main>
    <span class="eyebrow">quiz.json to Supabase</span>
    <h2>Seed SQL for <span id="title">&hellip;</span></h2>
    <p class="hint">Edit <b>quiz.json</b>, reload this page, copy the SQL below into the Supabase SQL editor and run it. It replaces the active quiz and puts the room in the lobby.</p>
    <div class="row mt"><button class="btn primary" onclick="copySql()">Copy SQL</button><span id="copied" class="small"></span></div>
    <textarea id="sql" class="sql mt" spellcheck="false"></textarea>
  </main>
</div>
<script src="lib.js"></script>
<script>
fcInitTheme();
function q(s){ return "'" + String(s).replace(/'/g, "''") + "'"; }
function jsonLit(arr){ return "'" + JSON.stringify(arr).replace(/'/g, "''") + "'::jsonb"; }

fetch("quiz.json").then(r => r.json()).then(quiz => {
  document.getElementById("title").textContent = quiz.title;
  const rows = quiz.questions.map((qn, i) =>
    "    (q_id, " + (i+1) + ", " + q(qn.prompt) + ", " + q(qn.type || "single") + ", " +
    jsonLit(qn.options || []) + ")"
  ).join(",\n");
  const sql =
"-- Generated from quiz.json. Run after schema.sql.\n" +
"do $$\ndeclare q_id uuid; first_q uuid;\nbegin\n" +
"  delete from quizzes where title = " + q(quiz.title) + ";\n" +
"  update quizzes set is_active = false where is_active;\n" +
"  insert into quizzes (title, is_active) values (" + q(quiz.title) + ", true) returning id into q_id;\n" +
"  insert into questions (quiz_id, sort_order, prompt, type, options) values\n" + rows + ";\n" +
"  select id into first_q from questions where quiz_id = q_id order by sort_order limit 1;\n" +
"  update quiz_state set active_quiz_id=q_id, current_question_id=first_q, phase='lobby', display_mode='bar', updated_at=now() where id=1;\n" +
"end $$;\n";
  document.getElementById("sql").value = sql;
}).catch(e => {
  document.getElementById("sql").value = "Could not load quiz.json (" + e + ").\nServe this folder over http (the deployed site, or a local server), not a file:// path.";
});

function copySql(){
  const t = document.getElementById("sql"); t.select();
  navigator.clipboard.writeText(t.value).then(() => { document.getElementById("copied").textContent = "Copied"; });
}
window.copySql = copySql;
</script>
</body>
</html>
